[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weather-assistant"
version = "0.1.0"
description = "Command-line weather assistant powered by an LLM, with streamed responses and parallel tool calls."
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai>=0.0.20",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
]

[tool.pytest.ini_options]
# `asyncio_mode = "auto"` means async test functions are run by pytest-asyncio
# automatically — no per-test `@pytest.mark.asyncio` decorator needed.
asyncio_mode = "auto"
testpaths = ["tests"]

[project.scripts]
# Points at __main__ so the console script gets the same load_dotenv + logging
# setup that `python -m weather_assistant` does.
weather-assistant = "weather_assistant.__main__:run"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_assistant"]
